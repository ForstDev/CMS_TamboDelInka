<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{titulo_pagina}}</title>
{{#if meta_descripcion}}<meta name="description" content="{{meta_descripcion}}">{{/if}}
<meta name="theme-color" content="{{color_fondo}}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Sofia+Sans:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  :root {
    --fondo: {{color_fondo}};
    --texto: {{color_texto}};
    --boton-bg: {{color_boton}};
    --boton-texto: {{color_boton_texto}};
    --boton-hover: {{color_boton_hover}};
    --texto-boton: {{color_texto_boton_hover}};
    --logo-n: {{logo_ancho}};
    --sans: "Sofia Sans", "Helvetica Neue", Arial, sans-serif;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  }

  /* Unidad fluida: toda la composición escala junta con el zoom y el tamaño de pantalla.
     Móvil: 1u = 1px a 390×720. Escritorio (≥768 px): 1u = 1px a 1366×768.
     Primero con vh (respaldo) y, si el navegador entiende svh, con svh (sin las barras del navegador). */
  :root { --u: clamp(.8px, min(.25641vw, .13889vh), 1.5px); }
  @media (min-width: 768px) {
    :root { --u: clamp(.85px, min(.07321vw, .13021vh), 2.4px); }
  }
  @supports (height: 1svh) {
    :root { --u: clamp(.8px, min(.25641vw, .13889svh), 1.5px); }
    @media (min-width: 768px) {
      :root { --u: clamp(.85px, min(.07321vw, .13021svh), 2.4px); }
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Página a pantalla completa. Sin imagen (color sólido): color plano. Con imagen, ver el bloque
     "Con foto" al final (foto a pantalla completa con su capa de legibilidad).
     Si el contenido no cabe (zoom extremo), la página crece y hace scroll vertical. */
  .hero {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding:
      calc(var(--u) * 30 + env(safe-area-inset-top, 0px))
      max(calc(var(--u) * 20), env(safe-area-inset-right, 0px))
      calc(var(--u) * 24 + env(safe-area-inset-bottom, 0px))
      max(calc(var(--u) * 20), env(safe-area-inset-left, 0px));
    background: var(--fondo);
  }

  .marca {
    width: 100%;
    max-width: calc(var(--u) * 1100);
    display: flex;
    flex-direction: column;
    align-items: {{logo_align}};
  }

  .logo {
    width: min(calc(var(--u) * var(--logo-n)), 80vw);
    max-width: 100%;
    height: auto;
    display: block;
    /* Halo sutil: el logo blanco se lee también sobre cielos claros. */
    filter: drop-shadow(0 1px 8px rgba(0, 0, 0, .5));
  }

  .divisor {
    display: block;
    width: calc(var(--u) * 44);
    height: 1px;
    background: rgba(255, 255, 255, .75);
    margin: calc(var(--u) * 14) 0 0;
  }

  /* El título siempre va centrado en la página, aunque el logo esté a un lado. */
  .titulo {
    align-self: center;
    max-width: 100%;
    margin-top: calc(var(--u) * 26);
    font-weight: 300;
    line-height: 1.05;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .42), 0 1px 3px rgba(0, 0, 0, .28);
    overflow-wrap: anywhere;
    text-wrap: balance;
  }

  .t1 {
    display: block;
    font-family: var(--sans);
    font-weight: 300;
    font-size: calc(var(--u) * 36);
    letter-spacing: .005em;
  }

  .t2 {
    display: block;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: calc(var(--u) * 30);
    margin-top: calc(var(--u) * 4);
  }

  /* Separador flexible entre el título y los botones (los lleva hacia abajo). */
  .espacio {
    flex: 1 1 auto;
    min-height: calc(var(--u) * 20);
  }

  .botones {
    display: flex;
    flex-direction: column;
    gap: calc(var(--u) * 12);
    width: min(100%, calc(var(--u) * 360));
  }

  .boton {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(var(--u) * 52);
    padding: calc(var(--u) * 10) calc(var(--u) * 18);
    border-radius: calc(var(--u) * 8);
    background: color-mix(in srgb, var(--boton-bg) 88%, transparent);
    border: 1px solid rgba(255, 255, 255, .16);
    color: var(--boton-texto);
    font-family: var(--sans);
    font-weight: 700;
    font-size: max(12px, calc(var(--u) * 15));
    line-height: 1.15;
    overflow-wrap: anywhere;
    letter-spacing: .05em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 8px 22px -12px rgba(0, 0, 0, .7);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    transition: background .2s, color .2s, transform .15s;
  }

  .boton:hover,
  .boton:focus-visible {
    background: var(--boton-hover);
    color: var(--texto-boton);
    transform: translateY(-1px);
  }

  .boton:focus-visible {
    outline: 2px solid rgba(255, 255, 255, .85);
    outline-offset: 2px;
  }

  .redes {
    margin-top: calc(var(--u) * 26);
    max-width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--u) * 14);
  }

  .redes-texto {
    font-size: max(11.5px, calc(var(--u) * 13));
    line-height: 1.25;
    font-weight: 400;
    max-width: 7.6em;
    text-align: right;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .45);
  }

  .iconos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: calc(var(--u) * 14);
  }

  .iconos a {
    color: var(--texto);
    font-size: max(22px, calc(var(--u) * 26));
    line-height: 1;
    text-decoration: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .45);
    transition: opacity .2s;
  }

  .iconos a:hover { opacity: .75; }

  .iconos a:focus-visible {
    outline: 2px solid rgba(255, 255, 255, .85);
    outline-offset: 3px;
    border-radius: 4px;
  }

  @media (min-width: 768px) {
    .t1 { font-size: calc(var(--u) * 60); }
    .t2 { font-size: calc(var(--u) * 48); }

    .botones {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: calc(var(--u) * 16);
      width: min(100%, calc(var(--u) * 960));
    }

    .boton {
      flex: 0 1 calc(var(--u) * 240);
      min-height: calc(var(--u) * 60);
    }

    .redes-texto { max-width: none; }
  }
{{#if fondo_imagen_css}}
  /* ================= Con foto (diseño fijo, no editable) ================= */

  /* Celular y PC: foto del hotel a pantalla completa, recortada con cover y el punto de encuadre. */
  .hero {
    background: var(--fondo) {{{fondo_imagen_css}}} {{fondo_foco_css}} / cover no-repeat;
  }

  /* --- Celular (< 768 px): capa de legibilidad fija sobre la foto ---
     Azul marino arriba (cielo), centro despejado y gris cálido abajo (sostiene los botones).
     Los mismos valores para todos los hoteles. Solo en celular: en PC ::before/::after son el
     reloj de arena (bloque siguiente) y no heredan nada de aquí. */
  @media (max-width: 767.98px) {
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(9, 30, 62, 0.60) 0%,
        rgba(9, 30, 62, 0.372) 14%,
        rgba(9, 30, 62, 0.156) 28%,
        rgba(9, 30, 62, 0) 42%,
        rgba(72, 68, 64, 0) 46%,
        rgba(72, 68, 64, 0.425) 58%,
        rgba(72, 68, 64, 0.748) 74%,
        rgba(72, 68, 64, 0.85) 100%
      );
    }
  }

  /* --- PC (≥ 768 px): foto a pantalla completa + oscurecido en "reloj de arena" acostado ---
     Dos triángulos con la base en el borde izquierdo y en el derecho (a lo alto completo) y las
     puntas tocándose en el centro: los bordes laterales quedan oscuros y arriba-centro y
     abajo-centro quedan claros. Sin degradado vertical.
     Cómo se dibuja (solo CSS, sin imágenes ni JS):
     - ::before = triángulo izquierdo, ::after = derecho (espejo).
     - Su fondo es un degradado HORIZONTAL azul marino muy oscuro: 52 % en el borde de la pantalla
       → 0 en el centro (la punta), así no hay "borde de figura".
     - La forma la recorta una máscara = intersección de dos degradados de esquina a esquina.
       Con "to top right" / "to bottom right" (etc.) el 50 % del degradado cae justo sobre una
       diagonal de la pantalla, a cualquier proporción: la forma se estira con la ventana.
       La máscara es opaca hasta la diagonal (las esquinas conservan todo el oscurecido) y se
       difumina hacia fuera hasta el 62 % (≈ 24 % del ancho en horizontal): sin líneas duras. */
  @media (min-width: 768px) {
    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }

    /* Izquierdo: lado izquierdo de las dos diagonales. */
    .hero::before {
      background: linear-gradient(
        to right,
        rgba(6, 16, 34, .52) 0%,
        rgba(6, 16, 34, .42) 12%,
        rgba(6, 16, 34, .24) 28%,
        rgba(6, 16, 34, .09) 40%,
        rgba(6, 16, 34, 0) 50%
      );
      -webkit-mask-image:
        linear-gradient(to top right, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%),
        linear-gradient(to bottom right, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%);
      mask-image:
        linear-gradient(to top right, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%),
        linear-gradient(to bottom right, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%);
    }

    /* Derecho: espejo del izquierdo. */
    .hero::after {
      background: linear-gradient(
        to left,
        rgba(6, 16, 34, .52) 0%,
        rgba(6, 16, 34, .42) 12%,
        rgba(6, 16, 34, .24) 28%,
        rgba(6, 16, 34, .09) 40%,
        rgba(6, 16, 34, 0) 50%
      );
      -webkit-mask-image:
        linear-gradient(to top left, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%),
        linear-gradient(to bottom left, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%);
      mask-image:
        linear-gradient(to top left, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%),
        linear-gradient(to bottom left, #000 50%, rgba(0, 0, 0, .55) 55%, rgba(0, 0, 0, .18) 59%, transparent 62%);
    }
  }
{{/if}}
  @media (prefers-reduced-motion: reduce) {
    .boton,
    .iconos a { transition: none; }

    .boton:hover,
    .boton:focus-visible { transform: none; }
  }
</style>
</head>
<body>

<main class="hero">
  <header class="marca">
    {{#if logo_url}}<img class="logo" src="{{logo_url}}" alt="{{logo_alt}}">{{/if}}
    <span class="divisor" aria-hidden="true"></span>
    <h1 class="titulo"><span class="t1">{{titulo_linea1}}</span><span class="t2">{{titulo_linea2}}</span></h1>
  </header>

  <div class="espacio" aria-hidden="true"></div>

  <nav class="botones" aria-label="Experiencias">
    {{{botones_html}}}
  </nav>

  {{#if redes_html}}<footer class="redes"><span class="redes-texto">{{redes_titulo}}</span><span class="iconos">{{{redes_html}}}</span></footer>{{/if}}
</main>

</body>
</html>
